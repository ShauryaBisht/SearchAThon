version: '3.8'

services:
  # --- React Frontend ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: searchathon-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always

  # --- Express Backend ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: searchathon-backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: true
    environment:
      - NODE_ENV=production
      - PORT=8000
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  # --- Redis Cache ---
  redis:
    image: redis:7-alpine
    container_name: searchathon-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  redis-data: